[package]
name = "notch"
version = "0.1.4"
edition = "2021"
description = "A living notch (dynamic island) for Windows - music, lyrics, focus, water, to-do, shelf and system HUDs."
license = "MIT"

[[bin]]
name = "notch"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# needed by the #[implement] macro, which expands to ::windows_core paths
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Data_Json",
    "Graphics_Imaging",
    "Media_Control",
    "Networking_Connectivity",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Web_Http",
    "Web_Http_Headers",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
