name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --message-format=short 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^(src|error|warning: unused)' build.log | grep -v '^warning' > errs.txt || true
          python - <<'PY'
          s = open("errs.txt", encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i in range(0, min(len(s), 300000), 30000):
              print("::error title=build errors " + str(i // 30000) + "::" + s[i:i + 30000])
          PY

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/notch.exe dist/Notch.exe
          (Get-Item dist/Notch.exe).Length

      - uses: actions/upload-artifact@v4
        with:
          name: Notch-windows-x64
          path: dist/Notch.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Notch.exe
