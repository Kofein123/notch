name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --message-format=short 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^(src|error|warning: unused)' build.log | grep -v '^warning' > errs.txt || true
          python - <<'PY'
          s = open("errs.txt", encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i in range(0, min(len(s), 300000), 30000):
              print("::error title=build errors " + str(i // 30000) + "::" + s[i:i + 30000])
          PY

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/notch.exe dist/Notch.exe
          (Get-Item dist/Notch.exe).Length

      - name: Smoke test (start, hover, page through)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        shell: pwsh
        run: ./.github/smoke.ps1 -Exe dist/Notch.exe

      - name: Publish smoke screenshots (ci-shots branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "smoke screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" HEAD:ci-shots

      - uses: actions/upload-artifact@v4
        with:
          name: Notch-windows-x64
          path: dist/Notch.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Notch.exe
