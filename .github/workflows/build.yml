name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  # TDLib (Telegram) is built once per pinned commit and cached; first build ~1 h.
  tdlib:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      TD_COMMIT: ea3f69ce11aef458bfbb09869b809ede4447486f
      TRIPLET: x64-windows-static-md
    steps:
      - name: Cache tdjson.dll
        id: cache
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdjson-${{ env.TD_COMMIT }}-${{ env.TRIPLET }}-v1

      - name: Build TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          git clone -q https://github.com/tdlib/td.git td
          git -C td checkout -q $env:TD_COMMIT
          & "$vcpkg\vcpkg.exe" install "gperf:$env:TRIPLET" "openssl:$env:TRIPLET" "zlib:$env:TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $gperf = Get-ChildItem -Recurse "$vcpkg\installed\$env:TRIPLET\tools" -Filter gperf.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force td/build | Out-Null
          cmake -S td -B td/build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:TRIPLET" `
            -DGPERF_EXECUTABLE="$($gperf.FullName)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build td/build --target tdjson --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force tdlib-out | Out-Null
          Copy-Item td/build/Release/tdjson.dll tdlib-out/
          (Get-Item tdlib-out/tdjson.dll).Length

      - uses: actions/upload-artifact@v4
        with:
          name: tdjson
          path: tdlib-out/tdjson.dll

  windows:
    needs: tdlib
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --message-format=short 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^(src|error|warning: unused)' build.log | grep -v '^warning' > errs.txt || true
          python - <<'PY'
          s = open("errs.txt", encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          # annotations are capped at ~4 KB each and 10 errors per step
          for i in range(0, min(len(s), 36000), 3600):
              print("::error title=build errors " + str(i // 3600) + "::" + s[i:i + 3600])
          PY

      - uses: actions/download-artifact@v4
        with:
          name: tdjson
          path: tdjson

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Notch | Out-Null
          Copy-Item target/release/notch.exe dist/Notch.exe
          Copy-Item target/release/notch.exe dist/Notch/Notch.exe
          Copy-Item tdjson/tdjson.dll dist/Notch/tdjson.dll
          Compress-Archive -Path dist/Notch/* -DestinationPath dist/Notch-windows-x64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (start, hover, page through)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        shell: pwsh
        run: ./.github/smoke.ps1 -Exe dist/Notch/Notch.exe

      - name: Upload smoke screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish smoke screenshots (temporary)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" HEAD:ci-shots

      - uses: actions/upload-artifact@v4
        with:
          name: Notch-windows-x64
          path: dist/Notch/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Notch-windows-x64.zip
            dist/Notch.exe
